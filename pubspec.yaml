name: wear_os_scrollbar
description: A Flutter plugin to show Material 3 Expressive scroll indicator for WearOS with customizable haptic response.
version: 1.1.4
homepage: https://github.com/Piero16301/wear_os_scrollbar
repository: https://github.com/Piero16301/wear_os_scrollbar
issue_tracker: https://github.com/Piero16301/wear_os_scrollbar/issues

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pmorales.wear_os_scrollbar
        pluginClass: WearOsScrollbarPlugin

topics:
  - wearos
  - smartwatch
  - ui
  - scrollbar
  - haptic
